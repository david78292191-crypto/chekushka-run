<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Погоня под Кровавой Луной</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 10px;
            background-color: #1a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        h1 {
            margin: 0 0 4px 0;
            font-size: clamp(15px, 3.2vw, 22px);
            color: #ff4757;
            text-shadow: 2px 2px 4px #000;
            text-align: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 850px;
            max-height: calc(100dvh - 50px);
            aspect-ratio: 2 / 1;
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.2);
            border: 3px solid #570a0a;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(to bottom, #4a1515, #2c0b0b);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 14px;
            right: 60px;
            display: flex;
            justify-content: space-between;
            font-size: clamp(13px, 3.2vw, 18px);
            font-weight: bold;
            text-shadow: 2px 2px 3px #000;
            pointer-events: none;
            z-index: 5;
        }
        #muteBtn {
            position: absolute;
            top: 6px;
            right: 10px;
            width: 36px;
            height: 36px;
            padding: 0;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 15;
            box-shadow: none;
        }
        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(20, 0, 0, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px;
            z-index: 10;
            overflow-y: auto;
        }
        #overlay h2 {
            font-size: clamp(18px, 4vw, 28px);
            margin: 0 0 4px 0;
            color: #ff4757;
        }
        #overlay p {
            font-size: clamp(11px, 2.5vw, 14px);
            margin: 0 0 8px 0;
            color: #ddd;
            max-width: 500px;
            line-height: 1.2;
        }
        .input-group {
            margin-bottom: 8px;
            width: 100%;
            max-width: 260px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            background: #2c0b0b;
            color: #fff;
            border: 2px solid #ff4757;
            border-radius: 6px;
            outline: none;
        }
        input[type="text"]::placeholder {
            color: #885555;
        }
        .difficulty-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .diff-btn {
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            background: #2c0b0b;
            color: #ff9999;
            border: 2px solid #570a0a;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .diff-btn.active {
            background: #ff4757;
            color: #fff;
            border-color: #ff6b81;
            box-shadow: 0 0 8px rgba(255, 71, 87, 0.5);
        }
        button.main-btn {
            padding: 8px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #ff4757;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }
        button.main-btn:hover {
            background-color: #ff6b81;
        }
        button.main-btn:active {
            transform: scale(0.95);
        }
        #leaderboard {
            margin-top: 8px;
            width: 100%;
            max-width: 280px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #570a0a;
            border-radius: 6px;
            padding: 6px;
            max-height: 100px;
            overflow-y: auto;
            text-align: left;
            font-size: 12px;
        }
        #leaderboard h3 {
            margin: 0 0 2px 0;
            font-size: 13px;
            color: #ff4757;
            text-align: center;
        }
        .lb-row {
            display: flex;
            justify-content: space-between;
            padding: 1px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        @media (max-height: 500px) and (orientation: landscape) {
            body { padding: 2px; }
            h1 { display: none; }
            #game-container { max-height: 98dvh; width: auto; height: 100%; }
            #leaderboard { max-height: 65px; }
        }
    </style>
</head>
<body>

    <h1>🩸 Погоня под Кровавой Луной 🍾</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="ui">
            <span>👤 <span id="currentName">Игрок</span> | 🍾: <span id="score">0</span></span>
            <span>🏆 Рекорд: <span id="highScore">0</span></span>
        </div>
        <button id="muteBtn" title="Вкл/Выкл звук">🔊</button>
        <div id="overlay">
            <h2 id="overlay-title">Кровавая Луна</h2>
            <p id="overlay-desc">Введи ник, выбери сложность и начни забег!</p>
            
            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Твой никнейм..." maxlength="12">
            </div>

            <div class="difficulty-selector">
                <button class="diff-btn" data-diff="easy">🟢 Изи</button>
                <button class="diff-btn active" data-diff="normal">🟡 Нормал</button>
                <button class="diff-btn" data-diff="hard">🔴 Хард</button>
            </div>

            <button id="startBtn" class="main-btn">🎵 Начать забег!</button>

            <div id="leaderboard">
                <h3>🏆 Таблица лидеров</h3>
                <div id="lbList"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const currentNameEl = document.getElementById('currentName');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const startBtn = document.getElementById('startBtn');
        const muteBtn = document.getElementById('muteBtn');
        const usernameInput = document.getElementById('usernameInput');
        const lbList = document.getElementById('lbList');
        const diffButtons = document.querySelectorAll('.diff-btn');

        let selectedDifficulty = 'normal';

        diffButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                diffButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedDifficulty = btn.getAttribute('data-diff');
            });
        });

        let playerName = sessionStorage.getItem('chekushka_username') || '';
        usernameInput.value = playerName;

        let leaderboard = JSON.parse(localStorage.getItem('chekushka_leaderboard')) || [];

        function updateLeaderboardUI() {
            lbList.innerHTML = '';
            if (leaderboard.length === 0) {
                lbList.innerHTML = '<div style="text-align:center; color:#888; font-size:11px;">Пока пусто</div>';
                return;
            }
            leaderboard.forEach((entry, index) => {
                const row = document.createElement('div');
                row.className = 'lb-row';
                row.innerHTML = `<span>${index + 1}. ${entry.name} (${entry.diff || 'normal'})</span> <b>${entry.score}</b>`;
                lbList.appendChild(row);
            });
        }
        updateLeaderboardUI();

        function saveScoreToLeaderboard(name, sc, diff) {
            if (!name || sc <= 0) return;
            let entryName = `${name} [${diff[0].toUpperCase()}]`;
            let existing = leaderboard.find(item => item.name === entryName);
            if (existing) {
                if (sc > existing.score) existing.score = sc;
            } else {
                leaderboard.push({ name: entryName, score: sc, diff: diff });
            }
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 10);
            localStorage.setItem('chekushka_leaderboard', JSON.stringify(leaderboard));
            updateLeaderboardUI();
        }

        let audioCtx = null;
        let isMuted = false;
        let musicTimer = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        const tuneNotes = [196, 220, 246.94, 293.66, 261.63, 220, 196, 164.81];
        let tuneStep = 0;

        function playMusicNote() {
            if (isMuted || !audioCtx || isGameOver) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
