<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Погоня под Кровавой Луной</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 10px;
            background-color: #1a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: clamp(18px, 4vw, 28px);
            color: #ff4757;
            text-shadow: 2px 2px 4px #000;
            text-align: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 850px;
            max-height: calc(100dvh - 60px);
            aspect-ratio: 2 / 1;
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.2);
            border: 3px solid #570a0a;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(to bottom, #4a1515, #2c0b0b);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui {
            position: absolute;
            top: 12px;
            left: 16px;
            right: 60px;
            display: flex;
            justify-content: space-between;
            font-size: clamp(14px, 3.5vw, 20px);
            font-weight: bold;
            text-shadow: 2px 2px 3px #000;
            pointer-events: none;
            z-index: 5;
        }
        #muteBtn {
            position: absolute;
            top: 8px;
            right: 12px;
            width: 38px;
            height: 38px;
            padding: 0;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 15;
            box-shadow: none;
        }
        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(20, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 16px;
            z-index: 10;
        }
        #overlay h2 {
            font-size: clamp(22px, 5vw, 36px);
            margin: 0 0 8px 0;
            color: #ff4757;
        }
        #overlay p {
            font-size: clamp(13px, 3vw, 18px);
            margin: 0 0 16px 0;
            color: #ddd;
            max-width: 500px;
            line-height: 1.4;
        }
        #startBtn {
            padding: clamp(10px, 2.5vw, 14px) clamp(20px, 5vw, 32px);
            font-size: clamp(16px, 4vw, 20px);
            font-weight: bold;
            color: #fff;
            background-color: #ff4757;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }
        #startBtn:hover {
            background-color: #ff6b81;
        }
        #startBtn:active {
            transform: scale(0.95);
        }
        @media (max-height: 500px) and (orientation: landscape) {
            body { padding: 4px; }
            h1 { display: none; }
            #game-container {
                max-height: 96dvh;
                width: auto;
                height: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Реальный аудио-тег с аркадной музыкой -->
    <audio id="bgMusic" loop preload="auto" src="https://actions.google.com/sounds/v1/ambiences/arcade_room.ogg"></audio>

    <h1>🩸 Погоня под Кровавой Луной 🍾</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="ui">
            <span>🍾 Чекушек: <span id="score">0</span></span>
            <span>🏆 Рекорд: <span id="highScore">0</span></span>
        </div>
        <button id="muteBtn" title="Вкл/Выкл звук">🔊</button>
        <div id="overlay">
            <h2 id="overlay-title">Кровавая Луна</h2>
            <p id="overlay-desc">Тройной прыжок активен!<br>Прыгай под кровавой луной и собирай чекушки.</p>
            <button id="startBtn">🎵 Начать забег с музыкой!</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const startBtn = document.getElementById('startBtn');
        const muteBtn = document.getElementById('muteBtn');
        const bgMusic = document.getElementById('bgMusic');
        bgMusic.volume = 0.6;

        let isMuted = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playJumpSound(jumpNum) {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            const startFreq = 150 + jumpNum * 80;
            const endFreq = 300 + jumpNum * 120;
            osc.frequency.setValueAtTime(startFreq, now);
            osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.12);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.13);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.13);
        }

        function playBottleSound() {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [587.33, 880, 1174.66];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + i * 0.055);
                gain.gain.setValueAtTime(0.25, now + i * 0.055);
                gain.gain.exponentialRampToValueAtTime(0.008, now + i * 0.055 + 0.16);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.055);
                osc.stop(now + i * 0.055 + 0.16);
            });
        }

        function playCrashSound() {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.linearRampToValueAtTime(35, now + 0.35);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.35);
        }

        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isMuted = !isMuted;
            muteBtn.innerText = isMuted ? '🔇' : '🔊';
            bgMusic.muted = isMuted;
        });

        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 400;
        const groundY = 340;

        let gameSpeed = 5.5;
        let score = 0;
        let highScore = localStorage.getItem('chekushka_highscore') || 0;
        highScoreEl.innerText = highScore;
        let isGameOver = true;
        let animationId;
        let frame = 0;

        const player = {
            x: 80,
            y: groundY - 50,
            width: 40,
            height: 50,
            dy: 0,
            jumpStrength: -11.5,
            gravity: 0.55,
            jumps: 0,
            maxJumps: 3,
            draw() {
                ctx.font = '45px Arial';
                ctx.textAlign = 'center';
                let wobble = Math.sin(frame * 0.2) * 5;
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(wobble * Math.PI / 180);
                ctx.fillText('🏃‍♂️', 0, 15);
                ctx.restore();
            },
            update() {
                this.dy += this.gravity;
                this.y += this.dy;

                if (this.y + this.height >= groundY) {
                    this.y = groundY - this.height;
                    this.dy = 0;
                    this.jumps = 0;
                }
                this.draw();
            },
            jump() {
                if (this.jumps < this.maxJumps) {
                    this.dy = this.jumpStrength;
                    this.jumps++;
                    playJumpSound(this.jumps);
                }
            }
        };

        let obstacles = [];
        let items = [];
        let clouds = [];
        let particles = [];

        class Obstacle {
            constructor() {
                const types = [
                    { emoji: '📦', w: 40, h: 40, yOffset: 0 },
                    { emoji: '🗑️', w: 40, h: 45, yOffset: 0 },
                    { emoji: '🚧', w: 45, h: 40, yOffset: 0 },
                    { emoji: '🐕', w: 45, h: 35, yOffset: 0 }
                ];
                const type = types[Math.floor(Math.random() * types.length)];
                this.emoji = type.emoji;
                this.width = type.w;
                this.height = type.h;
                this.x = GAME_WIDTH;
                this.y = groundY - this.height - type.yOffset;
            }
            draw() {
                ctx.font = '40px Arial';
                ctx.textAlign = 'left';
                ctx.fillText(this.emoji, this.x, this.y + this.height - 5);
            }
            update() {
                this.x -= gameSpeed;
                this.draw();
            }
        }

        class Item {
            constructor() {
                this.width = 35;
                this.height = 35;
                this.x = GAME_WIDTH;
                const heights = [groundY - 45, groundY - 110, groundY - 160];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.baseY = this.y;
                this.angle = Math.random() * Math.PI * 2;
            }
            draw() {
                ctx.font = '32px Arial';
                ctx.textAlign = 'left';
                this.y = this.baseY + Math.sin(this.angle) * 6;
                this.angle += 0.1;

                ctx.save();
                ctx.shadowColor = '#ff4757';
                ctx.shadowBlur = 15;
                ctx.fillText('🍾', this.x, this.y + 30);
                ctx.restore();
            }
            update() {
                this.x -= gameSpeed;
                this.draw();
            }
        }

        class Cloud {
            constructor() {
                this.x = GAME_WIDTH + Math.random() * 200;
                this.y = 40 + Math.random() * 100;
                this.speed = gameSpeed * 0.3;
                this.emoji = Math.random() > 0.5 ? '☁️' : '🏢';
                if (this.emoji === '🏢') {
                    this.y = groundY - 75;
                    this.speed = gameSpeed * 0.5;
                }
            }
            draw() {
                ctx.font = this.emoji === '🏢' ? '80px Arial' : '40px Arial';
                ctx.globalAlpha = 0.25;
                ctx.fillText(this.emoji, this.x, this.y + (this.emoji === '🏢' ? 70 : 0));
                ctx.globalAlpha = 1.0;
            }
            update() {
                this.x -= this.speed;
                this.draw();
            }
        }

        class FloatingText {
            constructor(text, x, y) {
                this.text = text;
                this.x = x;
                this.y = y;
                this.alpha = 1;
            }
            update() {
                this.y -= 1.5;
                this.alpha -= 0.02;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = 'bold 20px Arial';
                ctx.fillStyle = '#ff4757';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        function checkCollision(rect1, rect2) {
            const padding = 8;
            return (
                rect1.x + padding < rect2.x + rect2.width - padding &&
                rect1.x + rect1.width - padding > rect2.x + padding &&
                rect1.y + padding < rect2.y + rect2.height - padding &&
                rect1.y + rect1.height - padding > rect2.y + padding
            );
        }

        function drawEnvironment() {
            ctx.save();
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 35;
            ctx.font = '55px Arial';
            ctx.fillText('🩸🌕', 680, 75);
            ctx.restore();

            ctx.fillStyle = '#1f0808';
            ctx.fillRect(0, groundY, GAME_WIDTH, GAME_HEIGHT - groundY);

            ctx.fillStyle = '#570a0a';
            ctx.fillRect(0, groundY, GAME_WIDTH, 6);

            ctx.fillStyle = '#ff4757';
            for (let i = 0; i < GAME_WIDTH; i += 60) {
                let offset = (frame * gameSpeed) % 60;
                ctx.fillRect(i - offset, groundY + 28, 30, 4);
            }
        }

        function animate() {
            if (isGameOver) return;

            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            frame++;

            if (frame % 500 === 0) {
                gameSpeed += 0.5;
            }

            if (frame % 90 === 0) {
                clouds.push(new Cloud());
            }
            clouds.forEach((cloud, index) => {
                cloud.update();
                if (cloud.x < -100) clouds.splice(index, 1);
            });

            drawEnvironment();
            player.update();

            if (frame % Math.max(45, Math.floor(100 - gameSpeed * 3)) === 0) {
                if (Math.random() > 0.2) {
                    obstacles.push(new Obstacle());
                }
            }

            if (frame % 65 === 0) {
                items.push(new Item());
            }

            obstacles.forEach((obs, index) => {
                obs.update();
                if (checkCollision(player, obs)) {
                    gameOver();
                }
                if (obs.x + obs.width < 0) {
                    obstacles.splice(index, 1);
                }
            });

            items.forEach((item, index) => {
                item.update();
                if (checkCollision(player, item)) {
                    score++;
                    scoreEl.innerText = score;
                    playBottleSound();
                    particles.push(new FloatingText('+1 Бульк!', player.x, player.y));
                    items.splice(index, 1);
                } else if (item.x + item.width < 0) {
                    items.splice(index, 1);
                }
            });

            particles.forEach((p, index) => {
                p.update();
                if (p.alpha <= 0) particles.splice(index, 1);
            });

            animationId = requestAnimationFrame(animate);
        }

        function startGame(e) {
            if (e) e.stopPropagation();
            initAudio();
            isGameOver = false;
            score = 0;
            gameSpeed = 5.5;
            frame = 0;
            obstacles = [];
            items = [];
            clouds = [];
            particles = [];
            player.y = groundY - player.height;
            player.dy = 0;
            player.jumps = 0;
            scoreEl.innerText = score;
            overlay.style.display = 'none';

            // Жесткий запуск музыки по клику на кнопку старта
            bgMusic.currentTime = 0;
            bgMusic.play().catch(err => console.log(err));

            animate();
        }

        function gameOver() {
            isGameOver = true;
            bgMusic.pause();
            playCrashSound();
            cancelAnimationFrame(animationId);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('chekushka_highscore', highScore);
                highScoreEl.innerText = highScore;
            }
            overlayTitle.innerText = 'Споткнулся под луной! 💥';
            overlayDesc.innerHTML = `Собрано чекушек: <b>${score}</b>.<br>Рекорд: <b>${highScore}</b>`;
            startBtn.innerText = '🎵 Играть снова';
            overlay.style.display = 'flex';
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (isGameOver) {
                    startGame();
                } else {
                    player.jump();
                }
            }
        });

        window.addEventListener('pointerdown', (e) => {
            if (e.target === startBtn || e.target === muteBtn) return;
            if (!isGameOver) {
                e.preventDefault();
                player.jump();
            }
        }, { passive: false });

        startBtn.addEventListener('click', startGame);

        drawEnvironment();
        player.draw();
    </script>
</body>
</html>
