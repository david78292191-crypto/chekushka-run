<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Погоня за Чекушкой</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 10px;
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: clamp(18px, 4vw, 28px);
            color: #f39c12;
            text-shadow: 2px 2px 4px #000;
            text-align: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 850px;
            max-height: calc(100dvh - 60px);
            aspect-ratio: 2 / 1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 3px solid #16213e;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(to bottom, #0f3460, #533483);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui {
            position: absolute;
            top: 12px;
            left: 16px;
            right: 60px;
            display: flex;
            justify-content: space-between;
            font-size: clamp(14px, 3.5vw, 20px);
            font-weight: bold;
            text-shadow: 2px 2px 3px #000;
            pointer-events: none;
            z-index: 5;
        }
        #muteBtn {
            position: absolute;
            top: 8px;
            right: 12px;
            width: 38px;
            height: 38px;
            padding: 0;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 15;
            box-shadow: none;
        }
        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 16px;
            z-index: 10;
        }
        #overlay h2 {
            font-size: clamp(22px, 5vw, 36px);
            margin: 0 0 8px 0;
            color: #e94560;
        }
        #overlay p {
            font-size: clamp(13px, 3vw, 18px);
            margin: 0 0 16px 0;
            color: #ddd;
            max-width: 500px;
            line-height: 1.4;
        }
        #startBtn {
            padding: clamp(10px, 2.5vw, 14px) clamp(20px, 5vw, 32px);
            font-size: clamp(16px, 4vw, 20px);
            font-weight: bold;
            color: #fff;
            background-color: #e94560;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(233, 69, 96, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }
        #startBtn:hover {
            background-color: #ff2e4c;
        }
        #startBtn:active {
            transform: scale(0.95);
        }
        @media (max-height: 500px) and (orientation: landscape) {
            body { padding: 4px; }
            h1 { display: none; }
            #game-container {
                max-height: 96dvh;
                width: auto;
                height: 100%;
            }
        }
    </style>
</head>
<body>

    <h1>Погоня за Чекушкой 🍾</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="ui">
            <span>🍾 Чекушек: <span id="score">0</span></span>
            <span>🏆 Рекорд: <span id="highScore">0</span></span>
        </div>
        <button id="muteBtn" title="Вкл/Выкл звук">🔊</button>
        <div id="overlay">
            <h2 id="overlay-title">Погоня за Чекушкой</h2>
            <p id="overlay-desc">Прыгай через препятствия и собирай заветные бутылочки!<br><br>Управление: <b>Тап по экрану</b> или <b>Пробел</b></p>
            <button id="startBtn">🎵 Начать забег с музыкой!</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const startBtn = document.getElementById('startBtn');
        const muteBtn = document.getElementById('muteBtn');

        let audioCtx = null;
        let isMuted = false;
        let musicTimer = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Ритмичная 8-битная мелодия погони
        const melodyNotes = [220, 246.94, 261.63, 293.66, 329.63, 293.66, 261.63, 246.94];
        let noteStep = 0;

        function playMusicBeat() {
            if (isMuted || !audioCtx || isGameOver) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(melodyNotes[noteStep], now);

            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.18);

            noteStep = (noteStep + 1) % melodyNotes.length;
        }

        function startMusic() {
            if (musicTimer) clearInterval(musicTimer);
            musicTimer = setInterval(playMusicBeat, 180);
        }

        function stopMusic() {
            if (musicTimer) {
                clearInterval(musicTimer);
                musicTimer = null;
            }
        }

        function playJumpSound(jumpNum) {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            const startFreq = jumpNum === 1 ? 180 : 280;
            const endFreq = jumpNum === 1 ? 420 : 600;
            osc.frequency.setValueAtTime(startFreq, now);
            osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.14);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        }

        function playBottleSound() {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [587.33, 880, 1174.66];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + i * 0.055);
                gain.gain.setValueAtTime(0.25, now + i * 0.055);
                gain.gain.exponentialRampToValueAtTime(0.008, now + i * 0.055 + 0.16);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.055);
                osc.stop(now + i * 0.055 + 0.16);
            });
        }

        function playCrashSound() {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.linearRampToValueAtTime(45, now + 0.35);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.35);
        }

        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isMuted = !isMuted;
            muteBtn.innerText = isMuted ? '🔇' : '🔊';
            if (isMuted) stopMusic();
            else if (!isGameOver) startMusic();
        });

        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 400;
        const groundY = 340;

        let gameSpeed = 5.5;
        let score = 0;
        let highScore = localStorage.getItem('chekushka_highscore') || 0;
        highScoreEl.innerText = highScore;
        let isGameOver = true;
        let animationId;
        let frame = 0;

        const player = {
            x: 80,
            y: groundY - 50,
            width: 40,
            height: 50,
            dy: 0,
            jumpStrength: -12,
            gravity: 0.6,
            jumps: 0,
            maxJumps: 2,
            draw() {
                ctx.font = '45px Arial';
                ctx.textAlign = 'center';
                let wobble = Math.sin(frame * 0.2) * 5;
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(wobble * Math.PI / 180);
                ctx.fillText('🏃‍♂️', 0, 15);
                ctx.restore();
            },
            update() {
                this.dy += this.gravity;
                this.y += this.dy;

                if (this.y + this.height >= groundY) {
                    this.y = groundY - this.height;
                    this.dy = 0;
                    this.jumps = 0;
                }
                this.draw();
            },
            jump() {
                if (this.jumps < this.maxJumps) {
                    this.dy = this.jumpStrength;
                    this.jumps++;
                    playJumpSound(this.jumps);
                }
            }
        };

        let obstacles = [];
        let items = [];
        let clouds = [];
        let particles = [];

        class Obstacle {
            constructor() {
                const types = [
                    { emoji: '📦', w: 40, h: 40, yOffset: 0 },
                    { emoji: '🗑️', w: 40, h: 45, yOffset: 0 },
                    { emoji: '🚧', w: 45, h: 40, yOffset: 0 },
                    { emoji: '🐕', w: 45, h: 35, yOffset: 0 }
                ];
                const type = types[Math.floor(Math.random() * types.length)];
                this.emoji = type.emoji;
                this.width = type.w;
                this.height = type.h;
                this.x = GAME_WIDTH;
                this.y = groundY - this.height - type.yOffset;
            }
            draw() {
                ctx.font = '40px Arial';
                ctx.textAlign = 'left';
                ctx.fillText(this.emoji, this.x, this.y + this.height - 5);
            }
            update() {
                this.x -= gameSpeed;
                this.draw();
            }
        }

        class Item {
            constructor() {
                this.width = 35;
                this.height = 35;
                this.x = GAME_WIDTH;
                const heights = [groundY - 45, groundY - 110, groundY - 160];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.baseY = this.y;
                this.angle = Math.random() * Math.PI * 2;
            }
            draw() {
                ctx.font = '32px Arial';
                ctx.textAlign = 'left';
                this.y = this.baseY + Math.sin(this.angle) * 6;
                this.angle += 0.1;

                ctx.save();
                ctx.shadowColor = '#f1c40f';
                ctx.shadowBlur = 15;
                ctx.fillText('🍾', this.x, this.y + 30);
                ctx.restore();
            }
            update() {
                this.x -= gameSpeed;
                this.draw();
            }
        }

        class Cloud {
            constructor() {
                this.x = GAME_WIDTH + Math.random() * 200;
                this.y = 40 + Math.random() * 100;
                this.speed = gameSpeed * 0.3;
                this.emoji = Math.random() > 0.5 ? '☁️' : '🏢';
                if (this.emoji === '🏢') {
                    this.y = groundY - 75;
                    this.speed = gameSpeed * 0.5;
                }
            }
            draw() {
                ctx.font = this.emoji === '🏢' ? '80px Arial' : '40px Arial';
                ctx.globalAlpha = 0.3;
                ctx.fillText(this.emoji, this.x, this.y + (this.emoji === '🏢' ? 70 : 0));
                ctx.globalAlpha = 1.0;
            }
            update() {
                this.x -= this.speed;
                this.draw();
            }
        }

        class FloatingText {
            constructor(text, x, y) {
                this.text = text;
                this.x = x;
                this.y = y;
                this.alpha = 1;
            }
            update() {
                this.y -= 1.5;
                this.alpha -= 0.02;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = 'bold 20px Arial';
                ctx.fillStyle = '#2ecc71';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        function checkCollision(rect1, rect2) {
            const padding = 8;
            return (
                rect1.x + padding < rect2.x + rect2.width - padding &&
                rect1.x + rect1.width - padding
