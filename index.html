    <title>Погоня под Кровавой Луной</title>

            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {

            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            margin: 0 0 4px 0;
            font-size: clamp(14px, 3.2vw, 22px);
            color: #ff4757;
            text-shadow: 2px 2px 4px #000;
            text-align: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 820px;

            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

            left: 12px;
            right: 52px;
            display: flex;
            justify-content: space-between;
            font-size: clamp(11px, 2.8vw, 16px);
            font-weight: bold;
            text-shadow: 2px 2px 3px #000;
            pointer-events: none;
            z-index: 5;
        }
        #muteBtn {
            position: absolute;
            top: 5px;
            right: 8px;
            width: 32px;
            height: 32px;
            padding: 0;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 25;
            touch-action: manipulation;
        }
